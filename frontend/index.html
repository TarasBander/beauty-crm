<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d7f80" />
    <title>Beauty CRM</title>
    <!-- Ставимо тему ДО першого малювання, щоб темна тема не "блимала"
         світлою, поки вантажиться JS. Логіка та сама, що в
         src/shared/theme/theme.ts: збережений вибір, інакше системна тема. -->
    <script>
      var theme = 'light'
      try {
        var stored = localStorage.getItem('crm.theme')
        if (stored === 'light' || stored === 'dark') {
          theme = stored
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark'
        }
      } catch (e) {
        // localStorage недоступний (приватний режим) — лишаємо світлу тему
      }
      document.documentElement.dataset.theme = theme
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
